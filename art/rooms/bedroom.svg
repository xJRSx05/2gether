    <line x1="150" y1="346" x2="150" y2="372"/><line x1="470" y1="346" x2="470" y2="372"/><line x1="660" y1="346" x2="660" y2="372"/>
    <line x1="60" y1="372" x2="60" y2="402"/><line x1="300" y1="372" x2="300" y2="402"/><line x1="560" y1="372" x2="560" y2="402"/>
