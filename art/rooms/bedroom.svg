<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- ห้องนอน: ช่องหน้าต่าง (x110 y70 กว้าง210 สูง176) เป็นรู โปร่งใส ภาพนอกหน้าต่างอยู่ชั้นหลัง -->
