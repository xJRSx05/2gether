  <!-- ดอกไม้เล็กริมทาง -->
  <g><circle cx="230" cy="488" r="4" fill="#F4B6C2"/><circle cx="246" cy="492" r="3.5" fill="#FFE08A"/><circle cx="560" cy="490" r="4" fill="#B5D1F2"/><circle cx="574" cy="486" r="3.5" fill="#F4B6C2"/>
    <path d="M300 492 q4 -10 8 0z M312 494 q4 -12 8 0z" fill="#E0607E"/><path d="M302 494 h18" stroke="#F5F0E6" stroke-width="3"/></g>
  <!-- ขอบห้องมืดลงนิดๆ ให้ดูอบอุ่น -->
  <defs><radialGradient id="vg" cx="50%" cy="45%" r="75%"><stop offset=".6" stop-color="#3A2010" stop-opacity="0"/><stop offset="1" stop-color="#3A2010" stop-opacity=".22"/></radialGradient></defs>
  <rect width="800" height="500" fill="url(#vg)"/>
</svg>
