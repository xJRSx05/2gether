<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- สวน: ช่องโค้งในแนวพุ่มไม้ (x110 y70 กว้าง210 สูง176) เป็นรู โปร่งใส เห็นวิวตามฤดู -->
  <defs>
