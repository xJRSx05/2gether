    <rect x="56" y="298" width="8" height="48" fill="#8A5F3C"/><rect x="188" y="298" width="8" height="48" fill="#8A5F3C"/>
    <rect x="44" y="294" width="164" height="11" rx="4" fill="#B98757" stroke="#8A5F3C" stroke-width="2"/>
    <rect x="44" y="312" width="164" height="11" rx="4" fill="#B98757" stroke="#8A5F3C" stroke-width="2"/>
    <rect x="36" y="342" width="180" height="12" rx="4" fill="#C9955F" stroke="#8A5F3C" stroke-width="2"/>
    <rect x="48" y="354" width="9" height="28" rx="2" fill="#8A5F3C"/><rect x="195" y="354" width="9" height="28" rx="2" fill="#8A5F3C"/>
